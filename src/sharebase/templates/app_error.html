<html>
<head>
  <title>ShareBase &#8212; Application Error</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='sharebase.css') }}">
</head>
<body>
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="pageHead">Server Error in '/ShareBase' Application</td></tr>
  <tr><td style="padding:10px">
    <div class="errBox">
      <b>{{ error_class }}</b><br>
      {{ error_message }}
    </div>
    <div class="sectionBar">Stack Trace</div>
    <div class="stackTrace">{{ stack }}</div>
    <div style="margin-top:8px;color:#4a4a4a">
      Reference: {{ reference }} &nbsp;|&nbsp; ShareBase 4.2.1
    </div>
  </td></tr>
</table>
</body>
</html>
